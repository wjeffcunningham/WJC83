<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Archive | WJC83.CA</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    .wrap { max-width: 900px; margin: 1.25rem auto 3rem; padding: 0 1rem; text-align: left; }
    .msg { padding:.75rem 1rem; border:1px solid rgba(0,0,0,.12); border-radius:8px; margin:.5rem 0; }
    .ok { background: rgba(0,255,0,.06); }
    .err { background: rgba(255,0,0,.06); }

    h3 { margin:.9rem 0 .35rem; font-size:1.05rem; }
    ul { list-style: none; padding-left: 0; margin: .25rem 0 1rem; }
    li.item { display:block; margin:.6rem 0; padding:.6rem .75rem; border:1px solid #eee; border-radius:.75rem; }
    .meta { font-size:.9rem; opacity:.7; }

    .item.tier-2 { border-color:#e7e7ef; background:#fcfcff; box-shadow:0 2px 10px rgba(0,0,0,.05); }
    .item.tier-2 .row { display:grid; grid-template-columns: 96px 1fr; gap:.85rem; align-items:center; }
    .item.tier-2 .thumb { width:96px; height:72px; object-fit:cover; border-radius:.5rem; border:1px solid rgba(0,0,0,.08); }

    .item .title a { color: var(--ink, #111); text-decoration: none; font-weight: 600; }
    .item .title a:hover { text-decoration: underline; }

    .pills { display:flex; flex-wrap:wrap; gap:.5rem; margin-top:.4rem; }
    .pills a { font-size:.85rem; border:1px solid rgba(0,0,0,.12); border-radius:999px; padding:.15rem .55rem; text-decoration:none; color:var(--ink,#111); }
    .pills a:hover { text-decoration: underline; }

    .cat-head { display:flex; justify-content:space-between; align-items:flex-end; gap:.75rem; }
    .cat-head .actions a { font-size:.9rem; text-decoration:none; color: var(--ink,#111); opacity:.85; }
    .cat-head .actions a:hover { text-decoration: underline; }

    .locked { opacity:.55; }
    .locked .actions a { pointer-events:none; text-decoration:none; opacity:.6; }

    .group-head { margin-top:1.25rem; font-size:1.05rem; font-weight:600; }
  </style>
</head>
<body>
  <header class="site-header">
    <h1 class="site-title">Archive</h1>
  </header>

  <main class="wrap" id="app">
    <div class="msg ok" id="status">HTML loaded. Waiting for JS…</div>

    <section class="archive">
      <details open data-bucket="writing">
        <summary>
          <span class="chev" aria-hidden="true"></span>
          <span class="title">Writing</span>
          <span class="meta"><span class="count" id="count-writing">—</span></span>
        </summary>
        <div id="bucket-writing"></div>
      </details>

      <details data-bucket="old-movies">
        <summary>
          <span class="chev" aria-hidden="true"></span>
          <span class="title">Old Movies</span>
          <span class="meta"><span class="count" id="count-old-movies">—</span></span>
        </summary>
        <div id="bucket-old-movies"></div>
      </details>

      <details data-bucket="media">
        <summary>
          <span class="chev" aria-hidden="true"></span>
          <span class="title">Film & Performance</span>
        </summary>
        <div id="bucket-media"></div>
      </details>
    </section>
  </main>

  <script>
    if (window.__ARCHIVE_APP_RAN__) {
      console.debug('Archive app already ran, skipping.');
    } else {
      window.__ARCHIVE_APP_RAN__ = true;

      const ROOT_MANIFEST = './manifest.json';
      const MAX_PER_CATEGORY = 3;

      const CATEGORY_CONFIG = {
        writing: [
          { key:'academic',  label:'Academic Writing',  archiveHref:'/archive/academic/' },
          { key:'criticism', label:'Criticism',         archiveHref:'/archive/criticism/' },
          { key:'magic',     label:'Magic Writing',     archiveHref:'/archive/magic/' },
          { key:'technical', label:'Technical Writing', archiveHref:'/archive/technical/', locked:true }
        ],
        media: [
          { key:'acting',     label:'Acting Reel',   archiveHref:'/archive/acting/' },
          { key:'short-films',label:'Short Films',   archiveHref:'/archive/short-films/' }
        ]
      };

      const $ = (s, c=document)=>c.querySelector(s);
      const statusEl = $('#status');
      const bucketEls = { 'writing': $('#bucket-writing'), 'old-movies': $('#bucket-old-movies'), 'media': $('#bucket-media') };
      const countEls = { 'writing': $('#count-writing'), 'old-movies': $('#count-old-movies') };

      function byNewest(a,b){ return (b.date||'').localeCompare(a.date||''); }
      const prettyDate = d => (typeof d==='string' && /^\d{4}-\d{2}-\d{2}$/.test(d)) ? d : '';

      function primaryHref(it){
        const local=(it.path_html||it.path||it.pdf||'').replace(/^\/*/,'');
        if (it.category==='magic' && it.external) return it.external;
        return local ? '/'+local : '';
      }

      function linkPills(it, hrefPrimary){
        const pills=[];
        if (it.category==='magic'){
          if (hrefPrimary && it.external && hrefPrimary===it.external){
            if (it.path_html) pills.push(`<a href="/${it.path_html}" target="_blank">Local</a>`);
            if (it.pdf) pills.push(`<a href="/${it.pdf}" target="_blank">PDF</a>`);
          } else {
            if (it.external) pills.push(`<a href="${it.external}" target="_blank">External</a>`);
            if (it.pdf) pills.push(`<a href="/${it.pdf}" target="_blank">PDF</a>`);
          }
        } else {
          if (it.pdf) pills.push(`<a href="/${it.pdf}" target="_blank">PDF</a>`);
          if (it.external) pills.push(`<a href="${it.external}" target="_blank">External</a>`);
        }
        return pills.length?`<div class="pills">${pills.join('')}</div>`:'';
      }

      function itemLI(it){
        const href=primaryHref(it);
        const title=it.title||'Untitled';
        const meta=[prettyDate(it.date)].filter(Boolean).join(' • ');
        if ((it.tier||99)===2){
          const thumb=it.thumbnail?`<img class="thumb" src="/${it.thumbnail}" alt="">`:'<div></div>';
          return `<li class="item tier-2"><div class="row">${thumb}<div>
            <div class="title">${href?`<a href="${href}" target="_blank">${title}</a>`:title}</div>
            <div class="meta">${meta}</div>${it.blurb?`<div>${it.blurb}</div>`:''}${linkPills(it, href)}
          </div></div></li>`;
        }
        return `<li class="item"><div class="title">${href?`<a href="${href}" target="_blank">${title}</a>`:title}</div>
          <div class="meta">${meta}</div>${it.blurb?`<div>${it.blurb}</div>`:''}${linkPills(it, href)}</li>`;
      }

      function renderCategorySection(label, arr, archiveHref, opts={}){
        const sec=document.createElement('section');
        if(opts.locked) sec.classList.add('locked');
        sec.innerHTML=`<div class="cat-head"><h3>${opts.locked?'🔒 ':''}${label}</h3>
          <div class="actions">${archiveHref?`<a href="${archiveHref}">View full archive →</a>`:''}</div></div>
          <ul>${arr.slice(0,MAX_PER_CATEGORY).map(itemLI).join('')}</ul>`;
        return sec;
      }

      function renderBucketWriting(items){
        const target=bucketEls['writing'];
        const sorted=items.slice().sort(byNewest);
        const byCat=new Map();
        for(const it of sorted){
          const k=(it.category||'misc').toLowerCase();
          if(!byCat.has(k)) byCat.set(k,[]);
          byCat.get(k).push(it);
        }
        const frag=document.createDocumentFragment();
        for(const cfg of CATEGORY_CONFIG.writing){
          let arr=byCat.get(cfg.key)||[];
          if(cfg.key==='magic') arr=arr.filter(it=>(it.tier||99)===2).sort(byNewest);
          const sec=renderCategorySection(cfg.label, arr, cfg.archiveHref,{locked:!!cfg.locked});
          frag.appendChild(sec);
        }
        target.innerHTML=''; target.appendChild(frag);
        if(countEls['writing']) countEls['writing'].textContent=String(sorted.length);
      }

      function renderBucketGeneric(bucketKey, items){
        const target=bucketEls[bucketKey]; if(!target) return;
        const sorted=items.slice().sort(byNewest);
        target.innerHTML='<ul>'+sorted.map(itemLI).join('')+'</ul>';
        if(countEls[bucketKey]) countEls[bucketKey].textContent=String(sorted.length);
      }

      function renderBucketMedia(items){
        const target=bucketEls['media']; if(!target) return;
        const byCat=new Map();
        for(const it of items){ const k=(it.category||'misc').toLowerCase(); if(!byCat.has(k)) byCat.set(k,[]); byCat.get(k).push(it); }
        const frag=document.createDocumentFragment();
        for(const cfg of CATEGORY_CONFIG.media){
          const arr=byCat.get(cfg.key)||[];
          frag.appendChild(renderCategorySection(cfg.label, arr, cfg.archiveHref));
        }
        target.innerHTML=''; target.appendChild(frag);
      }

      async function loadJSON(url){const r=await fetch(url,{cache:'no-store'}); if(!r.ok) throw new Error(`HTTP ${r.status}`); return r.json();}
      async function render(){
        try{
          const root=await loadJSON(ROOT_MANIFEST);
          const items=root.items||[];
          const byBucket={};
          for(const it of items){const b=it.bucket||'misc'; (byBucket[b] ||= []).push(it);}
          renderBucketWriting(byBucket['writing']||[]);
          renderBucketGeneric('old-movies', byBucket['old-movies']||[]);
          renderBucketMedia(items.filter(it=>['acting','short-films'].includes((it.category||'').toLowerCase())));
          statusEl.textContent=`Archive loaded (${items.length} items).`;
        }catch(e){statusEl.textContent=`Error: ${e.message}`; statusEl.classList.add('err');}
      }
      document.readyState==='loading'?document.addEventListener('DOMContentLoaded',render):render();
    }
  </script>
</body>
</html>
