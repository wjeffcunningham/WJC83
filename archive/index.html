<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Archive | WJC83.CA</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    .wrap { max-width: 900px; margin: 1.25rem auto 3rem; padding: 0 1rem; text-align: left; }
    .msg { padding:.75rem 1rem; border:1px solid rgba(0,0,0,.12); border-radius:8px; margin:.5rem 0; }
    .ok { background: rgba(0,255,0,.06); }
    .err { background: rgba(255,0,0,.06); }

    h3 { margin:.9rem 0 .35rem; font-size:1.05rem; }
    ul { list-style: none; padding-left: 0; margin: .25rem 0 1rem; }
    li.item { display:block; margin:.6rem 0; padding:.6rem .75rem; border:1px solid #eee; border-radius:.75rem; background:#fff; position:relative; }
    .meta { font-size:.9rem; opacity:.7; }
    .bucket-blurb { font-size:.95rem; opacity:.85; margin:.25rem 0 .5rem; }
    .cat-blurb { font-size:.9rem; opacity:.75; margin:.1rem 0 .35rem; }
    .school { font-size:.85rem; opacity:.85; margin-top:.25rem; }

    .view-archive { margin:.4rem 0 1.2rem; }
    .view-archive a { font-size:.92rem; text-decoration:none; color:var(--ink,#111); opacity:.85 }
    .view-archive a:hover { text-decoration:underline; }

    .item.tier-2 { border-color:#e7e7ef; background:#fcfcff; box-shadow:0 2px 10px rgba(0,0,0,.05); }
    .item.tier-2 .row { display:grid; grid-template-columns: 96px 1fr; gap:.85rem; align-items:center; }
    .item.tier-2 .thumb { width:96px; height:72px; object-fit:cover; border-radius:.5rem; border:1px solid rgba(0,0,0,.08); }
    .item .title a { color: var(--ink, #111); text-decoration: none; font-weight: 600; }
    .item .title a:hover { text-decoration: underline; }

    .folder-item .title { display:flex; align-items:center; gap:.35rem; font-style: italic; color: var(--muted-ink, #666); }
    .folder-item .title a { font-style: italic; color: var(--muted-ink, #666); text-decoration:none; }
    .folder-item .title a:hover { text-decoration: underline; }

    /* Unified pill button design (consistent on mobile) */
    :root { --pill-fs: clamp(.78rem, 2.6vw, .85rem); --pill-pad-y:.18rem; --pill-pad-x:.6rem; }
    .pills{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.35rem}
    .pill, .pills a{
      font-size:var(--pill-fs);
      line-height:1;
      border:1px solid rgba(0,0,0,.12);
      border-radius:999px;
      padding:var(--pill-pad-y) var(--pill-pad-x);
      text-decoration:none;
      color:var(--ink,#111);
      display:inline-flex; align-items:center; gap:.35rem;
      background:#fff;
      will-change:transform;
      transition:transform .06s ease;
    }
    .pills a:hover { text-decoration:underline }
    .pill:active, .pills a:active { transform:translateY(1px) }
    .pill-ico{width:1em;height:1em;display:inline-block;vertical-align:-0.1em}

    /* Accolade badge, Draft badge, Role badge */
    .badge-accolade{
      display:inline-flex; align-items:center; gap:.35rem;
      font-size:.78rem; border:1px dashed rgba(0,0,0,.25);
      border-radius:999px; padding:.12rem .5rem; margin-left:.45rem;
      background:#fff;
    }
    .badge-draft{
      display:inline-flex; align-items:center; gap:.35rem;
      font-size:.75rem; border:1px dashed rgba(0,0,0,.28);
      border-radius:8px; padding:.1rem .4rem; margin-left:.5rem;
      background:#fff7f5; color:#8a3b00;
    }
    .badge-role{
      display:inline-flex; align-items:center; gap:.35rem;
      font-size:.75rem; border:1px solid rgba(0,0,0,.18);
      border-radius:999px; padding:.1rem .45rem; margin-left:.45rem;
      background:#eef2ff; color:#2c2ca0;
    }

    /* Star rating */
    .stars{display:inline-flex;gap:.1rem;margin-left:.45rem;opacity:.9}
    .stars svg{width:1em;height:1em}

    /* Drawer icon (decorative only for now) */
    .drawer-ico {
      font-size: .9rem;
      opacity: .6;
      margin-left: .4rem;
      cursor: default;
      user-select: none;
    }

    .part-pill{
      display:inline-flex;align-items:center;gap:.35rem;
      font-size:.75rem;border:1px solid rgba(0,0,0,.14);
      border-radius:999px;padding:.1rem .45rem;
      margin-left:.4rem;background:#fff;opacity:.85
    }

    /* ===== Emphasis shimmer for **double-asterisk** text ===== */
    .fx-em{
      background: linear-gradient(90deg, #111, #6c6cff, #111);
      background-size: 200% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: fx-shimmer 3s linear infinite;
      font-weight: 700;
    }
    @keyframes fx-shimmer{
      0% { background-position: 0% 50%; }
      100% { background-position: 200% 50%; }
    }
    @media (prefers-reduced-motion: reduce){
      .fx-em{ animation: none; background-size: 100% 100%; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <h1 class="site-title">Archive</h1>
  </header>

  <main class="wrap" id="app">
    <div class="msg ok" id="status">HTML loaded. Waiting for JS…</div>

    <section class="archive">
      <details open data-bucket="writing">
        <summary>
          <span class="title">Writing</span>
          <span class="meta"><span class="count" id="count-writing">—</span></span>
        </summary>
        <div class="bucket-blurb" id="blurb-writing"></div>
        <div id="bucket-writing"></div>
      </details>

      <details data-bucket="movies">
        <summary>
          <span class="title">Movies</span>
          <span class="meta"><span class="count" id="count-movies">—</span></span>
        </summary>
        <div class="bucket-blurb" id="blurb-movies"></div>
        <div id="bucket-movies"></div>
      </details>
    </section>
  </main>

<script>
if (window.__ARCHIVE_APP_RAN__) {
  console.debug('Archive app already ran, skipping.');
} else {
  window.__ARCHIVE_APP_RAN__ = true;

  const ROOT_MANIFEST = 'manifest.json?v=11';
  const $ = (s,c=document)=>c.querySelector(s);
  const statusEl = $('#status');
  const bucketEls = { writing: $('#bucket-writing'), movies: $('#bucket-movies') };
  const bucketBlurbEl = { writing: $('#blurb-writing'), movies: $('#blurb-movies') };
  const countEls = { writing: $('#count-writing'), movies: $('#count-movies') };

  const prettyDate = d => (typeof d==='string' && /^\d{4}-\d{2}-\d{2}/.test(d)) ? d.slice(0,10) : '';
  const visibleOnMain = it => Number(it.tier ?? 3) < 4;
  const isAbs = s => /^https?:\/\//i.test(s) || /^\/\//.test(s);
  const toHref = s => !s ? "" : (isAbs(s) ? s : (s.startsWith("/") ? s : "/"+s));

  // Replace **text** with <span class="fx-em">text</span>
  function decorateEmphasis(str){
    return String(str ?? '').replace(/\*\*(.+?)\*\*/g, '<span class="fx-em">$1</span>');
  }

  function partBadge(it){
    const p = Number(it.part||'');
    return (isFinite(p)&&p>0)
      ? ` <span class="part-pill">Part ${p}${it.locked?' 🔒':''}</span>`
      : (it.locked?` <span class="part-pill">🔒</span>`:'');
  }

  // --- visual helpers ---
  function starsHTML(it){
    const n = Number(it.rating||0), max = Number(it.rating_max||5)||5;
    if (!n || n<=0) return '';
    const star = filled => filled
      ? `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 17.3l-6.18 3.64 1.64-6.99L2 8.77l7.09-.61L12 1.5l2.91 6.66 7.09.61-5.46 5.18 1.64 6.99z"/></svg>`
      : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 17.3l-6.18 3.64 1.64-6.99L2 8.77l7.09-.61L12 1.5l2.91 6.66 7.09.61-5.46 5.18 1.64 6.99z"/></svg>`;
    let out=''; for(let i=1;i<=max;i++) out+=star(i<=n);
    return `<span class="stars" title="${n}/${max} stars">${out}</span>`;
  }
  function accoladeBadge(text){
    const inner = decorateEmphasis(text||'');
    return text ? `<span class="badge-accolade">${inner}</span>` : '';
  }
  function roleBadge(it){
    return (typeof it.role === 'string' && /editor/i.test(it.role))
      ? `<span class="badge-role">Editor</span>` : '';
  }
  function isDraft(it){
    const s=(it.status||'').toLowerCase(), t=(it.tag||'').toLowerCase();
    return s==='draft'||t==='draft'||it.draft===true;
  }

function linkPills(it, hrefPrimary){
  const norm=s=>s?toHref(s):"";
  const primary=norm(hrefPrimary);
  const icoPDF=`<svg class="pill-ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 15v-6h4a2 2 0 0 1 0 4h-2v2H8zm6-6h2v6h-2z" fill="currentColor"/></svg>`;
  const pills=[];

  // Primary file links
  if(it.pdf && norm(it.pdf)!==primary)
    pills.push(`<a class="pill" href="${toHref(it.pdf)}" target="_blank" rel="noopener">${icoPDF}<span>PDF</span></a>`);
  if(it.external)
    pills.push(`<a class="pill" href="${it.external}" target="_blank" rel="noopener">${new URL(it.external).hostname.replace(/^www\./,'')}</a>`);

  // Version drafts
  if(Array.isArray(it.versions)){
    for(const v of it.versions){
      const vpdf = v.pdf ? toHref(v.pdf) : '';
      const label = v.status || 'draft';
      if(vpdf) pills.push(`<a class="pill" href="${vpdf}" target="_blank" rel="noopener">${label}</a>`);
    }
  }

  return pills.length?`<div class="pills">${pills.join('')}</div>`:'';
}

  function primaryHref(it){
    const candidate=it.path_html||it.path||it.pdf||"";
    if(isAbs(candidate)) return candidate;
    if(it.external && !candidate) return it.external;
    return toHref(candidate)||it.external||"";
  }

  function hasDrawer(it){
    return (Array.isArray(it.versions)&&it.versions.length)||
           (Array.isArray(it.earlierDrafts)&&it.earlierDrafts.length);
  }

  function itemLI(it){
    const rawTitle = it.title || it.path_html || it.path || it.pdf || 'Untitled';
    const title = decorateEmphasis(rawTitle);
    const href  = primaryHref(it);
    const date  = prettyDate(it.date);
    const metaBits = [date];
    if((it.category||'')==='academic'&&it.school) metaBits.push(it.school);
    if(it.type==='folder') metaBits.push('Folder');
    if(it.type==='video') metaBits.push('Video');
    const metaLine=metaBits.filter(Boolean).join(' • ');
    const baseTierClass=(it.tier||99)===2?'item tier-2':'item';
    const featuredClass=it.featured?' featured':'';
    const draftBadge=isDraft(it)?`<span class="badge-draft">Draft</span>`:'';
    const drawerIcon=hasDrawer(it)?`<span class="drawer-ico" title="Earlier drafts">🗄️</span>`:'';
    const blurbHTML = it.blurb ? decorateEmphasis(it.blurb) : '';

    if(it.type==='folder'){
      return `<li class="item folder-item${featuredClass}">
        <div class="title">📁 ${href?`<a href="${href}" target="_blank" rel="noopener">${title}</a>`:title}${partBadge(it)}</div>
        <div class="meta">${metaLine}</div>
      </li>`;
    }

    if((it.tier||99)===2){
      const thumb=it.thumbnail?`<img class="thumb" src="${toHref(it.thumbnail)}" alt="">`:'<div></div>';
      return `<li class="${baseTierClass}${featuredClass}">
        <div class="row">
          ${thumb}
          <div>
            <div class="title">
              ${href?`<a href="${href}" target="_blank" rel="noopener">${title}</a>`:title}
              ${partBadge(it)}${draftBadge}${accoladeBadge(it.accolade)}${roleBadge(it)}${starsHTML(it)} ${drawerIcon}
            </div>
            <div class="meta">${metaLine}</div>
            ${blurbHTML?`<div>${blurbHTML}</div>`:''}
            ${linkPills(it,href)}
          </div>
        </div>
      </li>`;
    }

    return `<li class="${baseTierClass}${featuredClass}">
      <div class="title">
        ${href?`<a href="${href}" target="_blank" rel="noopener">${title}</a>`:title}
        ${partBadge(it)}${draftBadge}${accoladeBadge(it.accolade)}${roleBadge(it)}${starsHTML(it)} ${drawerIcon}
      </div>
      <div class="meta">${metaLine}</div>
      ${blurbHTML?`<div>${blurbHTML}</div>`:''}
      ${linkPills(it,href)}
    </li>`;
  }

  const CATEGORY_ARCHIVES={
    'academic':'/archive/writing/academic/',
    'criticism':'/archive/writing/criticism/',
    'magic':'/archive/writing/magic/',
    'technical':'/archive/writing/technical/'
  };

  function renderCategorySection(catKey,items,categoriesMap){
    items=items.filter(visibleOnMain);
    items.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
    const sec=document.createElement('section');
    const h3=document.createElement('h3');
    h3.textContent=catKey.replace(/-/g,' ').replace(/\b\w/g,m=>m.toUpperCase());
    sec.appendChild(h3);
    const cblurb=document.createElement('div');
    cblurb.className='cat-blurb';
    const catText=categoriesMap?.[catKey];
    if(catText){cblurb.innerHTML = decorateEmphasis(catText); sec.appendChild(cblurb);}
    const MAX=3;
    const shown=items.slice(0,MAX);
    const ul=document.createElement('ul');
    ul.innerHTML=shown.map(itemLI).join('');
    sec.appendChild(ul);
    const more=document.createElement('div');
    more.className='view-archive';
    const href=CATEGORY_ARCHIVES[catKey]||'';
    if(href) more.innerHTML=`<a href="${href}">View full ${h3.textContent} archive →</a>`;
    sec.appendChild(more);
    return {section:sec,count:items.length};
  }

  function renderBucket(bucketKey,bucketMeta,items,categoriesMap){
    const target=bucketEls[bucketKey];
    const blurb=bucketBlurbEl[bucketKey];
    const counter=countEls[bucketKey];
    if(!target)return;
    blurb.innerHTML = decorateEmphasis(bucketMeta?.blurb || '');
    const grouped={};
    for(const it of items){
      const cat=(it.category||'misc').toLowerCase();
      (grouped[cat] ||= []);
      grouped[cat].push(it);
    }
    const frag=document.createDocumentFragment();
    let bucketCount=0;
    for(const [cat,arr] of Object.entries(grouped)){
      const {section,count}=renderCategorySection(cat,arr,categoriesMap);
      if(count>0){bucketCount+=count;frag.appendChild(section);}
    }
    target.innerHTML='';
    target.appendChild(frag);
    if(counter) counter.textContent=String(bucketCount);
  }

  async function loadJSON(url){
    const res=await fetch(url,{cache:'no-store'});
    if(!res.ok) throw new Error(`HTTP ${res.status} for ${url}`);
    return res.json();
  }

  async function loadTopMagicFromChildren({limit=3,tier=3}={}){
    const MAGIC_ROOT='/archive/writing/magic/';
    const magicRoot=await loadJSON(MAGIC_ROOT+'manifest.json?v=1').catch(()=>null);
    if(!magicRoot) return [];
    const kids=magicRoot.children||[];
    const manifests=await Promise.all(
      kids.map(async k=>{
        try{
          const m=await loadJSON(MAGIC_ROOT + k.manifest.replace('./',''));
          return { key:k.key, base: MAGIC_ROOT + k.key + '/', items: m.items||[] };
        }catch{
          return { key:k.key, base: MAGIC_ROOT + k.key + '/', items: [] };
        }
      })
    );

    const all=[];
    for(const {key,base,items} of manifests){
      for(const it of items){
        if(Number(it.tier ?? 3)!==tier) continue; // Tier==3 only
        const norm=p=>p?(isAbs(p)?p:(base+p).replace(/\/+\.\//g,'/')):'';
        all.push({
          id: it.id || `magic/${key}/` + ((it.title||it.path_html||it.path||it.pdf||'item')
                .toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')),
          bucket:'writing',
          category:'magic',
          title:it.title,
          date:it.date,
          blurb:it.blurb,
          accolade:it.accolade,
          status:it.status,
          rating:it.rating,
          rating_max:it.rating_max,
          path_html: it.path_html ? norm(it.path_html) : '',
          path:      it.path ? norm(it.path) : '',
          pdf:       it.pdf ? norm(it.pdf) : '',
          external:  it.external || '',
          thumbnail: it.thumbnail ? norm(it.thumbnail) : ''
        });
      }
    }
    all.sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
    return all.slice(0,limit);
  }

  function dedupeItems(items){
    const seen=new Set();
    const keyOf=it=>
      (it.id) ||
      (it.path_html && toHref(it.path_html)) ||
      (it.path && toHref(it.path)) ||
      (it.pdf && toHref(it.pdf)) ||
      (it.external || '').toLowerCase() ||
      (it.title || '');
    const out=[];
    for(const it of items){
      const k=keyOf(it);
      if(k && seen.has(k)) continue;
      if(k) seen.add(k);
      out.push(it);
    }
    return out;
  }

  async function render(){
    try{
      const root=await loadJSON(ROOT_MANIFEST);
      const bucketsMeta=root.buckets||{};
      const categories=root.categories||{};
      let items=Array.isArray(root.items)?root.items.slice():[];

      // Pull top 3 Tier-3 Magic items from sub-manifests, inject, then de-dupe
      const magicTop3=await loadTopMagicFromChildren({limit:3,tier:3});
      items=dedupeItems([...items, ...magicTop3]);

      // Group by bucket and render
      const byBucket={};
      for(const it of items){
        const b=it.bucket||'misc';
        (byBucket[b] ||= []).push(it);
      }

      renderBucket('writing', bucketsMeta['writing'], byBucket['writing']||[], categories);
      renderBucket('movies',  bucketsMeta['movies'],  byBucket['movies'] ||[], categories);

      statusEl.textContent=`Archive loaded (${items.length} items).`;
      statusEl.classList.add('ok'); statusEl.classList.remove('err');
    }catch(e){
      console.error(e);
      statusEl.textContent=`Error loading archive: ${e.message}`;
      statusEl.classList.add('err'); statusEl.classList.remove('ok');
    }
  }

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded', render);
  }else{
    render();
  }
}
</script>
</body>
</html>
