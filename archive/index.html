<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Archive | WJC83.CA</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    .wrap { max-width: 900px; margin: 1.25rem auto 3rem; padding: 0 1rem; text-align: left; }
    .msg { padding:.75rem 1rem; border:1px solid rgba(0,0,0,.12); border-radius:8px; margin:.5rem 0; }
    .ok { background: rgba(0,255,0,.06); }
    .err { background: rgba(255,0,0,.06); }

    details { margin: 1rem 0; }
    summary { font-weight: 700; cursor: pointer; }
    h3 { margin:.9rem 0 .35rem; font-size:1.05rem; }
    h4 { margin:.5rem 0 .25rem; font-size:.95rem; opacity:.85 }
    ul { list-style: none; padding-left: 0; margin: .25rem 0 1rem; }
    li.item { display:block; margin:.6rem 0; padding:.6rem .75rem; border:1px solid #eee; border-radius:.75rem; }
    .meta { font-size:.9rem; opacity:.7; }
    .bucket-blurb { font-size:.95rem; opacity:.85; margin:.25rem 0 .5rem; }
    .cat-blurb { font-size:.9rem; opacity:.75; margin:.1rem 0 .35rem; }
    .school { font-size:.85rem; opacity:.85; margin-top:.25rem; }

    /* Tier-2 enhanced card (base hover/other styles live in style.css) */
    .item.tier-2 { border-color:#e7e7ef; background:#fcfcff; box-shadow:0 2px 10px rgba(0,0,0,.05); }
    .item.tier-2 .row { display:grid; grid-template-columns: 96px 1fr; gap:.85rem; align-items:center; }
    .item.tier-2 .thumb { width:96px; height:72px; object-fit:cover; border-radius:.5rem; border:1px solid rgba(0,0,0,.08); }
    .item .title a { color: var(--ink, #111); text-decoration: none; font-weight: 600; }
    .item .title a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <header class="site-header">
    <h1 class="site-title">Archive</h1>
  </header>

  <main class="wrap" id="app">
    <div class="msg ok" id="status">HTML loaded. Waiting for JS…</div>

    <details open data-bucket="writing">
      <summary>Writing</summary>
      <div class="bucket-blurb" id="blurb-writing"></div>
      <div id="bucket-writing"></div>
    </details>

    <details data-bucket="old-movies">
      <summary>Old Movies</summary>
      <div class="bucket-blurb" id="blurb-old-movies"></div>
      <div id="bucket-old-movies"></div>
    </details>
  </main>

  <script>
    if (window.__ARCHIVE_APP_RAN__) {
      console.debug('Archive app already ran, skipping.');
    } else {
      window.__ARCHIVE_APP_RAN__ = true;

      const ROOT_MANIFEST = './manifest.json';
      const $ = (s, c=document)=>c.querySelector(s);

      const statusEl = $('#status');
      const bucketEls = { 'writing': $('#bucket-writing'), 'old-movies': $('#bucket-old-movies') };
      const bucketBlurbEl = { 'writing': $('#blurb-writing'), 'old-movies': $('#blurb-old-movies') };

      const prettyDate = d => (typeof d==='string' && /^\d{4}-\d{2}-\d{2}$/.test(d)) ? d : '';

      const effectiveTier = (it) => {
        // Dojo shows like a Tier-3 card on the main index
        if ((it.subcategory || '') === 'dojo' && it.tier === 4) return 3;
        return it.tier;
      };

      function linkPills(it, hrefPrimary) {
        const pills = [];
        if (hrefPrimary) pills.push(`<a href="/${hrefPrimary}" target="_blank" rel="noopener">Read online</a>`);
        if (it.pdf) pills.push(`<a href="/${it.pdf.replace(/^\/*/, '')}" target="_blank" rel="noopener">PDF</a>`);
        if (it.external) pills.push(`<a href="${it.external}" target="_blank" rel="noopener">External</a>`);
        return pills.length ? `<div class="pills">${pills.join('')}</div>` : '';
      }

      function itemLI(it){
        const etier = effectiveTier(it);
        const title = it.title || it.path_html || it.path || it.pdf || 'Untitled';
        const href  = (it.path_html || it.path || it.pdf || '').replace(/^\/*/, '');
        const date  = prettyDate(it.date);
        const isAcademic = (it.category||'') === 'academic';
        const schoolLine = isAcademic && it.school ? `<div class="school">School: ${it.school}</div>` : '';
        const pills = linkPills(it, href);

        // Tier-2: enhanced card with thumbnail
        if (etier === 2) {
          const thumb = it.thumbnail ? `<img class="thumb" src="/${it.thumbnail}" alt="">` : '<div></div>';
          return `
            <li class="item tier-2">
              <div class="row">
                ${thumb}
                <div>
                  <div class="title"><a href="/${href}" target="_blank" rel="noopener">${title}</a></div>
                  <div class="meta">${[date, it.school || ''].filter(Boolean).join(' • ')}</div>
                  ${it.blurb ? `<div>${it.blurb}</div>` : ''}
                  ${schoolLine}
                  ${pills}
                </div>
              </div>
            </li>
          `;
        }

        // Tier-4 minimal (but Dojo is shown as Tier-3 via effectiveTier)
        if (etier === 4) {
          return `
            <li class="item">
              <div class="title"><a href="/${href}" target="_blank" rel="noopener">${title}</a></div>
              <div class="meta">${[date, it.school || ''].filter(Boolean).join(' • ')}</div>
              ${schoolLine}
              ${pills}
            </li>
          `;
        }

        // Default (Tier-1/3 normal card)
        return `
          <li class="item">
            <div class="title"><a href="/${href}" target="_blank" rel="noopener">${title}</a></div>
            <div class="meta">${[date, it.school || ''].filter(Boolean).join(' • ')}</div>
            ${it.blurb ? `<div>${it.blurb}</div>` : ''}
            ${schoolLine}
            ${pills}
          </li>
        `;
      }

      function renderBucket(bucketKey, bucketMeta, items, categoriesMap){
        const target = bucketEls[bucketKey];
        const blurb  = bucketBlurbEl[bucketKey];
        if (!target) return;

        blurb.textContent = bucketMeta?.blurb || '';

        // group by category → subcategory; sort desc by date
        const grouped = {};
        for (const it of items) {
          const cat = it.category || 'misc';
          const sub = it.subcategory || '';
          (grouped[cat] ||= {});
          (grouped[cat][sub] ||= []);
          grouped[cat][sub].push(it);
        }

        const frag = document.createDocumentFragment();

        for (const [cat, subMap] of Object.entries(grouped)) {
          const sec = document.createElement('section');

          const h3 = document.createElement('h3');
          h3.textContent = cat.replace(/-/g, ' ').replace(/\b\w/g, m=>m.toUpperCase());
          sec.appendChild(h3);

          const cblurb = document.createElement('div');
          cblurb.className = 'cat-blurb';
          const catText = categoriesMap?.[cat];
          if (catText) { cblurb.textContent = catText; sec.appendChild(cblurb); }

          for (const [sub, arr] of Object.entries(subMap)) {
            arr.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
            if (sub) {
              const h4 = document.createElement('h4');
              h4.textContent = sub.replace(/-/g, ' ').replace(/\b\w/g, m=>m.toUpperCase());
              sec.appendChild(h4);
            }
            const ul = document.createElement('ul');
            ul.innerHTML = arr.map(itemLI).join('');
            sec.appendChild(ul);
          }

          frag.appendChild(sec);
        }

        target.innerHTML = '';
        target.appendChild(frag);
      }

      async function loadJSON(url){
        const res = await fetch(url, {cache:'no-store'});
        if (!res.ok) throw new Error(`HTTP ${res.status} for ${url}`);
        return res.json();
      }

      async function render(){
        try {
          const root = await loadJSON(ROOT_MANIFEST);
          const bucketsMeta = root.buckets || {};
          const categories  = root.categories || {};
          const items       = Array.isArray(root.items) ? root.items.slice() : [];

          const byBucket = {};
          for (const it of items) {
            const b = it.bucket || 'misc';
            (byBucket[b] ||= []).push(it);
          }

          renderBucket('writing', bucketsMeta['writing'], byBucket['writing'] || [], categories);
          renderBucket('old-movies', bucketsMeta['old-movies'], byBucket['old-movies'] || [], categories);

          statusEl.textContent = `Archive loaded (${items.length} items).`;
          statusEl.classList.add('ok'); statusEl.classList.remove('err');
        } catch (e) {
          console.error(e);
          statusEl.textContent = `Error loading archive: ${e.message}`;
          statusEl.classList.add('err'); statusEl.classList.remove('ok');
        }
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', render);
      } else {
        render();
      }
    }
  </script>
</body>
</html>
