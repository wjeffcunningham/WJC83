<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Magic Archive | WJC83</title>
  <link rel="stylesheet" href="../../../style.css">
  <style>
    body{text-align:left}
    .wrap{max-width:900px;margin:1.25rem auto 3rem;padding:0 1rem}
    .msg{padding:.65rem .9rem;border:1px solid rgba(0,0,0,.12);border-radius:8px;margin:.5rem 0}
    .ok{background:rgba(0,255,0,.06)} .err{background:rgba(255,0,0,.06)}

    /* Hero header */
    header.hero{position:relative;margin:0 0 1rem;border-radius:12px;overflow:hidden}
    header.hero img.hero-img{width:100%;height:auto;display:block}
    header.hero .hero-inner{
      position:absolute;inset:auto 0 0 0;
      padding:1rem 1.25rem;
      color:#fff;
      text-shadow:0 2px 8px rgba(0,0,0,.45);
      font-weight:700;
      font-size:clamp(1.25rem,2.5vw,2rem);
    }

    /* Archive blocks */
    details.archive-block{margin:1.25rem 0 1.75rem;border:1px solid rgba(0,0,0,.08);border-radius:12px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.03);overflow:hidden}
    details > summary{list-style:none;cursor:pointer;padding:.8rem 1rem;display:flex;gap:1rem;align-items:flex-start}
    details > summary::-webkit-details-marker{display:none}

    /* Thumb fix: contain inside a framed box */
    .thumb-box{
      width:120px;height:90px;flex:0 0 auto;
      display:flex;align-items:center;justify-content:center;
      border:1px solid rgba(0,0,0,.1);border-radius:8px;
      background:#fafafa;overflow:hidden;
    }
    .thumb-img{
      max-width:100%;max-height:100%;
      width:auto;height:auto;object-fit:contain;display:block;
    }

    .archive-info h2{margin:0;font-size:1.15rem}
    .archive-info p{margin:.25rem 0 .25rem;font-size:.9rem;opacity:.85}

    .feed-items{padding:0 1rem 1rem;border-top:1px dashed rgba(0,0,0,.1)}
    .feed-item{padding:.5rem 0;border-bottom:1px dashed rgba(0,0,0,.06)}
    .feed-item:last-child{border-bottom:none}
    .feed-item .title a{color:var(--ink,#111);font-weight:600;text-decoration:none}
    .feed-item .title a:hover{text-decoration:underline}
    .feed-item .meta{font-size:.85rem;opacity:.7}

    .pills{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.25rem}
    .pills a{font-size:.8rem;border:1px solid rgba(0,0,0,.12);border-radius:999px;padding:.1rem .45rem;text-decoration:none;color:var(--ink,#111)}
    .pills a:hover{text-decoration:underline}
    .chev{margin-left:auto;opacity:.6}
  </style>
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <img class="hero-img" src="./magic-archive-header.webp" alt="Magic Archive header image" width="1600" height="500">
      <div class="hero-inner">
        <h1>Magic Archive</h1>
      </div>
    </header>

    <p class="msg ok" id="status">Loading…</p>
    <main id="archives"></main>
  </div>

  <script>
  const ROOT = './';
  const ROOT_MANIFEST = ROOT + 'manifest.json?v=1';
  const $ = (s,c=document)=>c.querySelector(s);
  const statusEl = $('#status');
  const container = $('#archives');

  const isAbs = s => /^https?:\/\//i.test(s)||/^\/\//.test(s)||s?.startsWith('/');
  const toHref = s => (!s?'':(s.startsWith('./')||s.startsWith('../')||isAbs(s))?s:'/'+s);
  const prettyDate = d => (typeof d==='string'&&/^\d{4}-\d{2}-\d{2}/.test(d))?d.slice(0,10):'';
  const tierOK = it => Number(it.tier??3)<=3;

  async function loadJSON(url){
    const r=await fetch(url,{cache:'no-store'});
    if(!r.ok) throw new Error(url+' '+r.status);
    return r.json();
  }

  function linkPills(it){
    const pills=[];
    const local=it.path_html||it.path||it.filename||it.pdf||'';
    if(local) pills.push(`<a href="${toHref(local)}" target="_blank" rel="noopener">Local</a>`);
    if(it.pdf) pills.push(`<a href="${toHref(it.pdf)}" target="_blank" rel="noopener">PDF</a>`);
    if(it.external) pills.push(`<a href="${it.external}" target="_blank" rel="noopener">External</a>`);
    return pills.length?`<div class="pills">${pills.join('')}</div>`:'';
  }

  // Fix thumbnails that were authored one level too shallow.
  function fixThumbPath(p){
    if (!p) return '';
    if (p.startsWith('../../assets/')) return '../' + p; // -> "../../../assets/..."
    return p;
  }

  function feedRow(it){
    const title=it.title||it.path_html||it.path||'Untitled';
    const href=it.path_html||it.path||it.pdf||it.external||'';
    return `
      <div class="feed-item">
        <div class="title"><a href="${toHref(href)}" target="_blank" rel="noopener">${title}</a></div>
        <div class="meta">${prettyDate(it.date)}${it.tier?` • Tier ${it.tier}`:''}</div>
        ${it.blurb?`<div>${it.blurb}</div>`:''}
        ${linkPills(it)}
      </div>
    `;
  }

  async function render(){
    try{
      const root=await loadJSON(ROOT_MANIFEST);
      let children=root.children||[];
      // Order: TCGplayer → StarCityGames → Magic Academy → Brainburst → Sideboard → MiseTings → Dojo
      const order=['tcgplayer','starcitygames','academy','brainburst','sideboard','misetings','dojo'];
      children.sort((a,b)=>order.indexOf(a.key)-order.indexOf(b.key));

      const collapsedKeys = new Set(['misetings','dojo']); // collapse these by default

      for(const child of children){
        const m=await loadJSON(child.manifest).catch(()=>({items:[]}));
        const items=(m.items||[]).filter(tierOK).sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
        const shown=items.slice(0,Math.min(5,items.length));

        const thumbSrc = fixThumbPath(child.thumbnail || '');
        const thumb = thumbSrc
          ? `<div class="thumb-box"><img class="thumb-img" src="${toHref(thumbSrc)}" alt=""></div>`
          : '';

        const openAttr = collapsedKeys.has(child.key) ? '' : ' open';
        const html=`
          <details class="archive-block" id="${child.key}"${openAttr}>
            <summary>
              ${thumb}
              <div class="archive-info">
                <h2><a href="${child.index}">${child.label}</a></h2>
                <p>${child.blurb||''}</p>
              </div>
              <span class="chev">▸</span>
            </summary>
            <div class="feed-items">
              ${shown.map(feedRow).join('')}
              ${items.length>shown.length?`<div style="margin-top:.4rem;"><a href="${child.index}">View all ${items.length} →</a></div>`:''}
            </div>
          </details>`;
        container.insertAdjacentHTML('beforeend',html);
      }

      // rotate chevron on open/close
      container.addEventListener('toggle', e=>{
        const d=e.target;
        if(d.tagName!=='DETAILS') return;
        const chev=d.querySelector('.chev');
        if(chev) chev.textContent = d.open ? '▾' : '▸';
      }, true);
      // init chevrons
      container.querySelectorAll('details.archive-block').forEach(d=>{
        const chev=d.querySelector('.chev');
        if(chev) chev.textContent = d.open ? '▾' : '▸';
      });

      statusEl.textContent='Loaded all Magic sub-archives.';
      statusEl.classList.add('ok');statusEl.classList.remove('err');
    }catch(e){
      console.error(e);
      statusEl.textContent='Error: '+e.message;
      statusEl.classList.add('err');statusEl.classList.remove('ok');
    }
  }

  render();
  </script>
</body>
</html>
