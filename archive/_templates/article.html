<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{TITLE}}</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    .wrap{max-width:760px;margin:1.25rem auto 3rem;padding:0 1rem}
    .article h1{margin:.25rem 0 .9rem;font-weight:800;letter-spacing:.01em}
    .article p{margin:.9rem 0;line-height:1.65}
    .article img{max-width:100%;height:auto;border-radius:8px;border:1px solid rgba(0,0,0,.08)}
    figure{margin:1rem 0}
    figcaption{margin-top:.4rem;font-size:.92rem;opacity:.75}
    blockquote{border-left:3px solid rgba(0,0,0,.15);padding-left:.85rem;margin:.95rem 0}
    pre,code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
    pre{overflow:auto;padding:.75rem;background:rgba(0,0,0,.04);border-radius:6px}
    .source-note{margin:.5rem 0 1.1rem;opacity:.8;font-size:.98rem}
  </style>
</head>
<body>
  <header class="site-header"><h1 class="site-title">Archive</h1></header>

  <main class="wrap article">
    <h1>{{TITLE}}</h1>
    <p class="source-note">
      <em>Originally published on {{SOURCE}}. This local mirror preserves text and images for archival use.</em>
    </p>

    {{BODY}}
  </main>
</body>
</html>
