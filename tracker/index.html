<style>
  /* Tracker-specific additions on top of the site stylesheet. */
  :root {
    --surface: #fff; --tint: #f4f4f2;
    --s-bg: #e6efe1; --s-ink: #2f5a22;
    --m-bg: #f6ecc9; --m-ink: #6b4f00;
    --l-bg: #f4d9d5; --l-ink: #8a2a1e;

    --sans: Arial, Helvetica, sans-serif;
  }
  body { max-width: 1120px; }
  main.tracker { padding-top: 32px; }
  .tracker h1 { font-size: clamp(1.8rem, 5vw, 2.6rem); margin-bottom: 6px; }
  .lede { color: var(--quiet); margin: 0; }
  .meta { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 10px; font: 13px var(--sans); color: var(--quiet); }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: var(--quiet); margin-right: 5px; }
  .dot.live { background: var(--ok); } .dot.err { background: var(--over); }
  .spacer { flex: 1; }

  .deadlines { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 0; margin: 24px 0; border-top: 1px solid var(--ink); border-bottom: 1px solid var(--line); }
  .dl { padding: 10px 14px 10px 0; font-family: var(--sans); }
  .dl .k { font-size: 11px; color: var(--quiet); text-transform: uppercase; letter-spacing: .05em; }
  .dl .v { font-weight: 700; margin-top: 2px; font-size: 15px; }
  .dl .c { font-size: 13px; color: var(--quiet); }

  .controls { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: end; padding: 0 0 14px; margin-bottom: 10px; border-bottom: 1px solid var(--line); font-family: var(--sans); }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field > span { font: 11px var(--sans); color: var(--quiet); text-transform: uppercase; letter-spacing: .05em; }
  select, input[type=text], input[type=date], textarea {
    font: 14px var(--sans); color: var(--ink); background: var(--surface); border: 1px solid var(--line);
    border-radius: 0; padding: 6px 8px; min-height: 34px; }
  textarea { min-height: 80px; resize: vertical; width: 100%; font-family: Georgia, serif; font-size: 15px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 5px 10px; font: 13px var(--sans); cursor: pointer; }
  .chip:hover { border-color: var(--ink); }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  label.check { display: flex; gap: 6px; align-items: center; font: 14px var(--sans); color: var(--ink); min-height: 34px; }
  .btn { font: 700 14px var(--sans); padding: 7px 12px; cursor: pointer; border: 1px solid var(--ink); background: var(--ink); color: var(--paper); }
  .btn:hover { background: #333; }
  .btn.ghost { background: transparent; color: var(--ink); font-weight: 400; }
  .btn.ghost:hover { background: var(--tint); }
  .btn.danger { background: transparent; color: var(--over); border-color: var(--over); font-weight: 400; }

  .summary { display: flex; gap: 16px; flex-wrap: wrap; font: 13px var(--sans); color: var(--quiet); margin: 0 0 10px; }
  .summary b { color: var(--ink); }

  .tbl { width: 100%; border-collapse: collapse; }
  .tbl th { text-align: left; font: 700 11px var(--sans); text-transform: uppercase; letter-spacing: .05em; color: var(--quiet);
    padding: 8px 8px 8px 0; border-bottom: 1px solid var(--ink); white-space: nowrap; }
  .tbl th button { all: unset; cursor: pointer; }
  .tbl th button:hover { color: var(--ink); }
  .tbl th .arrow { margin-left: 4px; }
  .tbl td { padding: 10px 8px 10px 0; border-bottom: 1px solid var(--line); vertical-align: top; font: 14px var(--sans); }
  .tbl td:first-child { font-family: Georgia, "Times New Roman", serif; font-size: 16px; padding-left: 8px; }
  .tbl tr.group td { font: 700 13px var(--sans); padding: 18px 0 6px; border-bottom: 1px solid var(--ink); }
  .tbl tr.task:hover td { background: var(--tint); }
  tr.st-done td .title { color: var(--quiet); text-decoration: line-through; }
  tr.st-blocked td:first-child { box-shadow: inset 3px 0 0 var(--over); }
  tr.st-doing td:first-child { box-shadow: inset 3px 0 0 var(--ink); }
  .needs { color: var(--quiet); font: 13px var(--sans); margin-top: 3px; }
  .notes { color: var(--ink); font-size: 14px; margin-top: 5px; white-space: pre-wrap; font-style: italic; }
  .more-info { margin-top: 5px; font: 13px var(--sans); color: var(--quiet); }
  .more-info summary { cursor: pointer; width: max-content; }
  .more-info summary:hover { color: var(--ink); }
  .more-info p { margin: 6px 0 0; color: var(--ink); font: 14px/1.45 Georgia, "Times New Roman", serif; max-width: 62ch; }
  .more-info p.src { color: var(--quiet); font: 12px/1.4 var(--sans); }
  .more-info a { word-break: break-all; }
  .flag { font: 700 10px var(--sans); color: var(--over); border: 1px solid var(--over); padding: 0 4px; margin-left: 6px; vertical-align: 2px; letter-spacing: .04em; }
  .size { display: inline-block; min-width: 24px; text-align: center; font: 700 12px var(--sans); padding: 2px 6px; }
  .size.S { background: var(--s-bg); color: var(--s-ink); }
  .size.M { background: var(--m-bg); color: var(--m-ink); }
  .size.L { background: var(--l-bg); color: var(--l-ink); }
  .grant { font: 12px var(--sans); border: 1px solid var(--line); padding: 1px 5px; white-space: nowrap; }
  .due { white-space: nowrap; }
  .due .rel { display: block; font-size: 12px; color: var(--quiet); }
  .due.over .rel { color: var(--over); font-weight: 700; }
  .due.soon .rel { color: var(--soon); font-weight: 700; }
  td select.status { min-height: 30px; padding: 3px 6px; font-size: 13px; }
  .edit { all: unset; cursor: pointer; font: 13px var(--sans); text-decoration: underline; text-underline-offset: .14em; }
  .empty { padding: 30px; text-align: center; color: var(--quiet); }

  dialog { border: 1px solid var(--ink); border-radius: 0; background: var(--surface); color: var(--ink);
    width: min(580px, calc(100vw - 32px)); padding: 20px; }
  dialog::backdrop { background: rgba(0,0,0,.35); }
  dialog h2 { margin: 0 0 14px; font-size: 1.2rem; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .grid2 .full { grid-column: 1 / -1; }
  .grid2 input, .grid2 select { width: 100%; }
  .actions { display: flex; gap: 8px; margin-top: 16px; }

  .banner { border: 1px solid var(--ink); padding: 10px 12px; font: 14px var(--sans); margin-bottom: 14px; }
  .banner button { margin-left: 8px; }

  @media (max-width: 760px) {
    .tbl thead { display: none; }
    .tbl, .tbl tbody, .tbl tr, .tbl td { display: block; width: 100%; }
    .tbl tr.task { border-bottom: 1px solid var(--line); padding: 8px 0; }
    .tbl tr.task td { border: 0; padding: 3px 0; }
    .tbl tr.task td:first-child { padding-left: 8px; }
    .tbl td[data-label]::before { content: attr(data-label) ": "; color: var(--quiet); font-size: 12px; }
    .tbl tr.task td.c-size, .tbl tr.task td.c-grant, .tbl tr.task td.c-owner { display: inline-block; width: auto; margin-right: 10px; }
    .grid2 { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header class="site-header">
  <a class="site-name" href="../">W. Jeff Cunningham</a>
</header>
<main class="tracker">
  <div>
    <h1>Grant Tracker</h1>
    <p class="lede">Bill Cunningham archive · BCHDP 2027–28 and Canada Council Artistic Creation</p>
    <div class="meta">
      <span id="syncState"><span class="dot"></span>Loading…</span>
      <span class="spacer"></span>
      <label class="check">I am
        <select id="me"></select>
      </label>
      <button class="btn ghost" id="refresh" type="button">Refresh</button>
    </div>
  </div>

  <section class="deadlines" aria-label="Key dates">
    <div class="dl"><div class="k">BCHDP internal</div><div class="v">Thu Dec 3</div><div class="c" data-count="2026-12-03"></div></div>
    <div class="dl"><div class="k">BCHDP final</div><div class="v">Mon Dec 7, 9:00 am</div><div class="c" data-count="2026-12-07"></div></div>
    <div class="dl"><div class="k">CCA target</div><div class="v">Week of Dec 14</div><div class="c" data-count="2026-12-16"></div></div>
    <div class="dl"><div class="k">BCHDP funding confirmed</div><div class="v">Jan 30, 2027</div><div class="c" data-count="2027-01-30"></div></div>
  </section>

  <div id="banner"></div>

  <section class="controls" aria-label="Sort and filter">
    <div class="field"><span>Sort by</span>
      <select id="sort">
        <option value="pressing">Most pressing</option>
        <option value="person">Person</option>
        <option value="difficulty">Difficulty (L → S)</option>
        <option value="due">Due date</option>
        <option value="grant">Grant</option>
      </select>
    </div>
    <div class="field"><span>Person</span><div class="chips" id="personChips"></div></div>
    <div class="field"><span>Grant</span>
      <select id="grantFilter"><option value="">All</option><option>BCHDP</option><option>CCA</option><option>Both</option></select>
    </div>
    <div class="field"><span>Size</span>
      <select id="sizeFilter"><option value="">All</option><option value="L">L</option><option value="M">M</option><option value="S">S</option></select>
    </div>
    <label class="check"><input type="checkbox" id="hideDone" checked> Hide done</label>
    <span class="spacer"></span>
    <button class="btn" id="addBtn" type="button">+ Add task</button>
  </section>

  <div class="summary" id="summary"></div>

  <table class="tbl">
    <thead><tr>
      <th><button data-sort="pressing">Task</button></th>
      <th><button data-sort="person">Owner</button></th>
      <th><button data-sort="difficulty">Size</button></th>
      <th><button data-sort="grant">Grant</button></th>
      <th><button data-sort="due">Due</button></th>
      <th>Status</th>
      <th></th>
    </tr></thead>
    <tbody id="rows"></tbody>
  </table>
</main>

<dialog id="dlg">
  <form method="dialog" id="form">
    <h2 id="dlgTitle">Edit task</h2>
    <div class="grid2">
      <label class="field full"><span>Task</span><input type="text" name="title" required></label>
      <label class="field"><span>Owner</span><input type="text" name="owner" list="owners" placeholder="e.g. Jeff / Darryl"></label>
      <label class="field"><span>Due</span><input type="date" name="due"></label>
      <label class="field"><span>Size</span><select name="size"><option>S</option><option>M</option><option>L</option></select></label>
      <label class="field"><span>Grant</span><select name="grant"><option>BCHDP</option><option>CCA</option><option>Both</option></select></label>
      <label class="field"><span>Status</span><select name="status"></select></label>
      <label class="field"><span>Category</span><select name="category"><option>Ask</option><option>Writing</option><option>Budget</option><option>Partner</option><option>Admin</option><option>Review</option></select></label>
      <label class="check full"><input type="checkbox" name="blocker"> Blocker (other tasks wait on this)</label>
      <label class="field full"><span>Needs / unblocks</span><input type="text" name="needs"></label>
      <label class="field full"><span>Notes</span><textarea name="notes"></textarea></label>
      <label class="field full"><span>Details (shown under the fold)</span><textarea name="details"></textarea></label>
      <label class="field full"><span>Source</span><input type="text" name="source"></label>
    </div>
    <div class="meta" id="dlgMeta"></div>
    <div class="actions">
      <button class="btn" value="save" type="submit">Save</button>
      <button class="btn ghost" value="cancel" type="submit" formnovalidate>Cancel</button>
      <span class="spacer"></span>
      <button class="btn danger" id="delBtn" type="button">Delete</button>
    </div>
  </form>
</dialog>
<datalist id="owners"></datalist>

/* ===== State ===== */
let tasks = [];
let live = false;
const $ = s => document.querySelector(s);
const store = {
  get(k, d) { try { const v = localStorage.getItem('gt.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('gt.' + k, JSON.stringify(v)); } catch {} }
};
const view = store.get('view', { sort: 'pressing', people: [], grant: '', size: '', hideDone: true });

/* ===== Data layer ===== */
async function api(body) {
  const opts = body
    ? { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) }
    : {};
  const res = await fetch(API_URL, opts);
  const data = await res.json();
  if (!data.ok) throw new Error(data.error || 'Request failed');
  return data;
}
function setSync(kind, text) {
  $('#syncState').innerHTML = `<span class="dot ${kind}"></span>${text}`;
}
function applyLocal(list) {
  for (const p of PATCHES) for (const u of p.tasks) {
    const t = list.find(x => x.id === u.id);
    if (t) Object.assign(t, u); else list.push({ status: 'todo', ...u });
  }
  return list;
}
const linkify = s => esc(s).replace(/https?:\/\/[^\s<]+/g, u => `<a href="${u}" target="_blank" rel="noopener">${u.replace(/^https?:\/\//, '')}</a>`);
async function load() {
  if (!API_URL) {
    tasks = store.get('preview', null) || applyLocal(SEED.map(t => ({ ...t })));
    setSync('', 'Preview mode: changes stay in this browser');
    render(); return;
  }
  try {
    setSync('', 'Syncing…');
    let data = await api();
    tasks = data.tasks;
    const applied = data.applied || [];
    if (tasks.length) {
      for (const p of PATCHES) {
        if (applied.includes(p.id)) continue;
        data = await api({ action: 'patch', id: p.id, tasks: p.tasks });
        tasks = data.tasks;
      }
    }
    live = true;
    setSync('live', 'Shared · updated ' + new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }));
    $('#banner').innerHTML = tasks.length ? '' :
      `<div class="banner">The shared sheet is empty. <button class="btn" id="seedBtn" type="button">Load the starter tasks</button></div>`;
    const sb = $('#seedBtn');
    if (sb) sb.onclick = async () => { sb.disabled = true; await api({ action: 'seed', tasks: SEED }); load(); };
  } catch (e) {
    setSync('err', 'Couldn’t reach the shared sheet: ' + e.message);
  }
  render();
}
async function save(task) {
  task.updatedBy = $('#me').value || '';
  task.updated = new Date().toISOString();
  const i = tasks.findIndex(t => t.id === task.id);
  if (i >= 0) tasks[i] = task; else tasks.push(task);
  render();
  if (!API_URL) { store.set('preview', tasks); return; }
  try { tasks = (await api({ action: 'upsert', task })).tasks; setSync('live', 'Saved'); render(); }
  catch (e) { setSync('err', 'Save failed: ' + e.message + '. Refresh and try again.'); }
}
async function remove(id) {
  tasks = tasks.filter(t => t.id !== id);
  render();
  if (!API_URL) { store.set('preview', tasks); return; }
  try { tasks = (await api({ action: 'delete', id })).tasks; render(); }
  catch (e) { setSync('err', 'Delete failed: ' + e.message); }
}

/* ===== Helpers ===== */
const SIZE_RANK = { L: 3, M: 2, S: 1 };
const STATUS_RANK = { blocked: 0, doing: 1, todo: 2, done: 9 };
const today = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const parseDate = s => { if (!s) return null; const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const daysUntil = s => { const d = parseDate(s); return d ? Math.round((d - today()) / 864e5) : 9999; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const firstOwner = o => (o || 'Unassigned').split('/')[0].trim();
const ownsTask = (t, person) => {
  const names = (t.owner || '').split('/').map(s => s.trim().toLowerCase());
  return names.includes(person.toLowerCase()) || (person !== 'Everyone' && names.includes('everyone'));
};
function relDue(t) {
  if (!t.due) return { cls: '', text: '' };
  const n = daysUntil(t.due);
  if (t.status === 'done') return { cls: '', text: '' };
  if (n < 0) return { cls: 'over', text: `${-n} day${n === -1 ? '' : 's'} overdue` };
  if (n === 0) return { cls: 'soon', text: 'today' };
  if (n <= 7) return { cls: 'soon', text: `in ${n} day${n === 1 ? '' : 's'}` };
  return { cls: '', text: `in ${n} days` };
}
const fmtDate = s => { const d = parseDate(s); return d ? d.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' }) : '—'; };

// Lower = more pressing: overdue/soonest first, blockers ahead within the same date, bigger jobs first.
const pressing = t => [
  t.status === 'done' ? 1 : 0,
  daysUntil(t.due),
  t.blocker ? 0 : 1,
  STATUS_RANK[t.status] ?? 5,
  -(SIZE_RANK[t.size] || 0),
];
const cmp = (a, b) => { for (let i = 0; i < a.length; i++) { if (a[i] < b[i]) return -1; if (a[i] > b[i]) return 1; } return 0; };
const SORTS = {
  pressing: (a, b) => cmp(pressing(a), pressing(b)),
  due: (a, b) => cmp([a.status === 'done', daysUntil(a.due)], [b.status === 'done', daysUntil(b.due)]),
  difficulty: (a, b) => cmp([a.status === 'done', -(SIZE_RANK[a.size] || 0), ...pressing(a)], [b.status === 'done', -(SIZE_RANK[b.size] || 0), ...pressing(b)]),
  person: (a, b) => firstOwner(a.owner).localeCompare(firstOwner(b.owner)) || cmp(pressing(a), pressing(b)),
  grant: (a, b) => (a.grant || '').localeCompare(b.grant || '') || cmp(pressing(a), pressing(b)),
};
const GROUP = {
  person: t => firstOwner(t.owner),
  grant: t => t.grant || 'Other',
  difficulty: t => ({ L: 'Large', M: 'Medium', S: 'Small' }[t.size] || 'Unsized'),
};

/* ===== Render ===== */
function render() {
  const list = tasks
    .filter(t => !view.hideDone || t.status !== 'done')
    .filter(t => !view.grant || t.grant === view.grant)
    .filter(t => !view.size || t.size === view.size)
    .filter(t => !view.people.length || view.people.some(p => ownsTask(t, p)))
    .sort(SORTS[view.sort]);

  const open = tasks.filter(t => t.status !== 'done');
  const overdue = open.filter(t => t.due && daysUntil(t.due) < 0).length;
  const week = open.filter(t => t.due && daysUntil(t.due) >= 0 && daysUntil(t.due) <= 7).length;
  const blocked = open.filter(t => t.status === 'blocked').length;
  const done = tasks.length - open.length;
  $('#summary').innerHTML =
    `<span><b>${open.length}</b> open</span><span><b>${overdue}</b> overdue</span>` +
    `<span><b>${week}</b> due in the next 7 days</span><span><b>${blocked}</b> blocked</span>` +
    `<span><b>${done}</b> done</span><span>Showing ${list.length}</span>`;

  const statusOpts = cur => STATUSES.map(([v, l]) => `<option value="${v}"${v === cur ? ' selected' : ''}>${l}</option>`).join('');
  let html = '', lastGroup = null;
  const groupFn = GROUP[view.sort];
  for (const t of list) {
    if (groupFn) {
      const g = groupFn(t);
      if (g !== lastGroup) { html += `<tr class="group"><td colspan="7">${esc(g)}</td></tr>`; lastGroup = g; }
    }
    const r = relDue(t);
    html += `<tr class="task st-${esc(t.status)}" data-id="${esc(t.id)}">
      <td><div class="title">${esc(t.title)}${t.blocker && t.status !== 'done' ? '<span class="flag">BLOCKER</span>' : ''}</div>
        ${t.needs ? `<div class="needs">${esc(t.needs)}</div>` : ''}
        ${t.notes ? `<div class="notes">${esc(t.notes)}</div>` : ''}
        ${t.details || t.source ? `<details class="more-info"><summary>Details</summary>${t.details ? t.details.split(/\n\n+/).map(x => `<p>${esc(x)}</p>`).join('') : ''}${t.source ? `<p class="src">Source: ${linkify(t.source)}</p>` : ''}</details>` : ''}</td>
      <td class="c-owner" data-label="Owner">${esc(t.owner || '—')}</td>
      <td class="c-size"><span class="size ${esc(t.size)}">${esc(t.size || '?')}</span></td>
      <td class="c-grant"><span class="grant">${esc(t.grant)}</span></td>
      <td class="due ${r.cls}" data-label="Due">${fmtDate(t.due)}<span class="rel">${r.text}</span></td>
      <td><select class="status" aria-label="Status">${statusOpts(t.status)}</select></td>
      <td><button class="edit" type="button">Edit</button></td>
    </tr>`;
  }
  $('#rows').innerHTML = html || `<tr><td colspan="7" class="empty">No tasks match these filters.</td></tr>`;

  document.querySelectorAll('.tbl th button').forEach(b => {
    b.querySelector('.arrow')?.remove();
    if (b.dataset.sort === view.sort) b.insertAdjacentHTML('beforeend', '<span class="arrow">▾</span>');
  });
  document.querySelectorAll('[data-count]').forEach(el => {
    const n = daysUntil(el.dataset.count);
    el.textContent = n > 0 ? `${n} days away` : n === 0 ? 'Today' : 'Passed';
  });
  const owners = [...new Set(tasks.map(t => t.owner).filter(Boolean))].sort();
  $('#owners').innerHTML = owners.map(o => `<option value="${esc(o)}">`).join('');
}

/* ===== Controls ===== */
function persist() { store.set('view', view); render(); }
$('#personChips').innerHTML = PEOPLE.map(p => `<button class="chip" type="button" data-p="${p}" aria-pressed="${view.people.includes(p)}">${p}</button>`).join('');
$('#personChips').onclick = e => {
  const b = e.target.closest('.chip'); if (!b) return;
  const p = b.dataset.p;
  view.people = view.people.includes(p) ? view.people.filter(x => x !== p) : [...view.people, p];
  b.setAttribute('aria-pressed', view.people.includes(p));
  persist();
};
$('#sort').value = view.sort; $('#sort').onchange = e => { view.sort = e.target.value; persist(); };
$('#grantFilter').value = view.grant; $('#grantFilter').onchange = e => { view.grant = e.target.value; persist(); };
$('#sizeFilter').value = view.size; $('#sizeFilter').onchange = e => { view.size = e.target.value; persist(); };
$('#hideDone').checked = view.hideDone; $('#hideDone').onchange = e => { view.hideDone = e.target.checked; persist(); };
document.querySelectorAll('.tbl th button').forEach(b => b.onclick = () => { view.sort = b.dataset.sort; $('#sort').value = view.sort; persist(); });
$('#refresh').onclick = load;

$('#me').innerHTML = '<option value="">—</option>' + PEOPLE.filter(p => p !== 'Everyone').map(p => `<option>${p}</option>`).join('');
$('#me').value = store.get('me', '');
$('#me').onchange = e => store.set('me', e.target.value);

$('#rows').addEventListener('change', e => {
  if (!e.target.matches('select.status')) return;
  const id = e.target.closest('tr').dataset.id;
  const t = tasks.find(x => x.id === id);
  save({ ...t, status: e.target.value });
});
$('#rows').addEventListener('click', e => {
  if (!e.target.matches('.edit')) return;
  openDialog(tasks.find(x => x.id === e.target.closest('tr').dataset.id));
});

/* ===== Dialog ===== */
const dlg = $('#dlg'), form = $('#form');
form.status.innerHTML = STATUSES.map(([v, l]) => `<option value="${v}">${l}</option>`).join('');
let editing = null;
function openDialog(t) {
  editing = t || null;
  dlg.returnValue = '';
  const d = t || { title: '', owner: $('#me').value || '', due: '', size: 'M', grant: 'BCHDP', status: 'todo', category: 'Writing', blocker: '', needs: '', notes: '' };
  $('#dlgTitle').textContent = t ? 'Edit task' : 'Add task';
  for (const k of ['title', 'owner', 'due', 'size', 'grant', 'status', 'category', 'needs', 'notes', 'details', 'source']) form[k].value = d[k] || '';
  form.blocker.checked = !!d.blocker;
  $('#delBtn').style.display = t ? '' : 'none';
  $('#dlgMeta').textContent = t && t.updated ? `Last changed ${new Date(t.updated).toLocaleString()}${t.updatedBy ? ' by ' + t.updatedBy : ''}` : '';
  dlg.showModal();
}
$('#addBtn').onclick = () => openDialog(null);
dlg.addEventListener('close', () => {
  if (dlg.returnValue !== 'save') return;
  const vals = Object.fromEntries(['title', 'owner', 'due', 'size', 'grant', 'status', 'category', 'needs', 'notes', 'details', 'source'].map(k => [k, form[k].value.trim()]));
  vals.blocker = form.blocker.checked ? 'yes' : '';
  const id = editing ? editing.id : 't' + Date.now().toString(36);
  save({ ...(editing || {}), ...vals, id });
});
$('#delBtn').onclick = () => {
  if (editing && confirm('Delete this task for everyone?')) { dlg.close('cancel'); remove(editing.id); }
};

load();
setInterval(() => { if (API_URL && !dlg.open && document.visibilityState === 'visible') load(); }, 60000);
</script>
</body>
</html>
