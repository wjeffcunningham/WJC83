<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>W.C. Photo Archive</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f6f5f1;
  --surface: #fff;
  --border: #e2e0db;
  --text: #1a1a1a;
  --muted: #888;
  --accent: #2a52a0;
  --tag-people: #dbeafe; --tag-people-t: #1e40af;
  --tag-events: #fef3c7; --tag-events-t: #92400e;
  --tag-places: #d1fae5; --tag-places-t: #065f46;
  --tag-sports: #fce7f3; --tag-sports-t: #9d174d;
  --tag-aviation: #ede9fe; --tag-aviation-t: #5b21b6;
  --tag-misc: #f3f4f6; --tag-misc-t: #374151;
  --scanned: #16a34a;
}
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); font-size: 13px; }

/* HEADER */
header { background: #1a1a2e; color: #fff; padding: 1rem 1.5rem; }
header h1 { font-size: 17px; font-weight: 600; letter-spacing: -0.2px; }
header p { font-size: 12px; color: #aaa; margin-top: 2px; }
.progress-bar-wrap { margin-top: 10px; background: rgba(255,255,255,0.15); border-radius: 4px; height: 5px; width: 280px; }
.progress-bar { height: 5px; border-radius: 4px; background: #22c55e; transition: width 0.3s; }
.progress-label { font-size: 11px; color: #aaa; margin-top: 4px; }

/* TOOLBAR */
.toolbar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0.6rem 1.5rem; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; position: sticky; top: 0; z-index: 20; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
.search-wrap { position: relative; flex: 1; min-width: 180px; max-width: 340px; }
.search-wrap input { width: 100%; padding: 6px 11px 6px 30px; border: 1px solid #ccc; border-radius: 7px; font-size: 13px; }
.search-wrap input:focus { outline: none; border-color: var(--accent); }
.search-wrap .icon { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: #999; font-size: 13px; }
.jump-wrap { display: flex; align-items: center; gap: 4px; }
.jump-wrap label { font-size: 12px; color: var(--muted); white-space: nowrap; }
.jump-wrap input { width: 72px; padding: 6px 8px; border: 1px solid #ccc; border-radius: 7px; font-size: 13px; }
.jump-wrap input:focus { outline: none; border-color: var(--accent); }
.tag-filters { display: flex; gap: 4px; flex-wrap: wrap; }
.tf { padding: 4px 9px; border: 1px solid #ddd; border-radius: 20px; font-size: 11px; cursor: pointer; background: #fff; color: var(--muted); white-space: nowrap; }
.tf.active { border-color: var(--accent); background: var(--accent); color: #fff; }
.scan-toggle { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); cursor: pointer; white-space: nowrap; padding: 5px 0; }
.scan-toggle input { cursor: pointer; accent-color: var(--scanned); }
.stat { font-size: 12px; color: var(--muted); white-space: nowrap; margin-left: auto; }
.export-btn { padding: 5px 11px; border: 1px solid #ccc; border-radius: 7px; font-size: 12px; background: #fff; cursor: pointer; white-space: nowrap; }
.export-btn:hover { background: var(--bg); }

/* TABLE */
.wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
thead th { background: #f0efeb; border-bottom: 1px solid var(--border); padding: 8px 12px; text-align: left; font-weight: 500; font-size: 12px; color: var(--muted); cursor: pointer; white-space: nowrap; user-select: none; letter-spacing: 0.3px; text-transform: uppercase; }
thead th:hover { color: var(--text); }
thead th.sorted { color: var(--accent); }
tbody tr { border-bottom: 1px solid #f0efec; transition: background 0.1s; }
tbody tr:hover { background: #faf9f6; }
tbody tr.scanned-row { background: #f0fdf4; }
tbody tr.scanned-row:hover { background: #dcfce7; }
td { padding: 7px 12px; vertical-align: middle; }
td.neg { font-family: "SF Mono", "Fira Code", monospace; font-size: 12px; color: var(--accent); font-weight: 600; white-space: nowrap; width: 90px; }
td.subject { font-size: 13px; }
td.notes { font-size: 12px; color: #666; font-style: italic; }
td.cat { width: 90px; }
td.scan-cell { width: 60px; text-align: center; }
td.scan-cell input { cursor: pointer; accent-color: var(--scanned); width: 15px; height: 15px; }

/* TAGS */
.tag { display: inline-block; padding: 2px 7px; border-radius: 10px; font-size: 11px; font-weight: 500; }
.tag-People { background: var(--tag-people); color: var(--tag-people-t); }
.tag-Events { background: var(--tag-events); color: var(--tag-events-t); }
.tag-Places { background: var(--tag-places); color: var(--tag-places-t); }
.tag-Sports { background: var(--tag-sports); color: var(--tag-sports-t); }
.tag-Aviation { background: var(--tag-aviation); color: var(--tag-aviation-t); }
.tag-Misc { background: var(--tag-misc); color: var(--tag-misc-t); }

/* XREF */
.xref { display: inline-block; margin-left: 6px; font-size: 11px; background: #f0f0f0; border-radius: 4px; padding: 1px 5px; color: #555; font-style: normal; }

/* EMPTY */
.empty { padding: 3rem; text-align: center; color: var(--muted); }

/* TOAST */
.toast { position: fixed; bottom: 24px; right: 24px; background: #1a1a1a; color: #fff; padding: 10px 16px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 100; }
.toast.show { opacity: 1; }
</style>
</head>

const SCAN_KEY = "wc_scanned_v1";
const CATS = ["People","Events","Places","Sports","Aviation","Misc"];

let scanned = loadScanned();
let sc = "neg", sd = 1, activeTag = "", unscanOnly = false;

function loadScanned() {
  try { const s = localStorage.getItem(SCAN_KEY); if (s) return new Set(JSON.parse(s)); } catch(e) {}
  return new Set();
}
function saveScanned() {
  try { localStorage.setItem(SCAN_KEY, JSON.stringify([...scanned])); } catch(e) {}
}
function toggleScanned(id) {
  if (scanned.has(id)) { scanned.delete(id); } else { scanned.add(id); }
  saveScanned();
  updateProgress();
  // update just this row's appearance
  const tr = document.querySelector('tr[data-id="' + id + '"]');
  if (tr) tr.className = scanned.has(id) ? 'scanned-row' : '';
  updateStat();
}

function updateProgress() {
  const n = scanned.size;
  const pct = (n / DATA.length * 100).toFixed(1);
  document.getElementById('pbar').style.width = pct + '%';
  document.getElementById('plabel').textContent = n + ' of 2259 scanned (' + pct + '%)';
}

function nv(s) {
  const m = (s || "").match(/^(\d+)/);
  return m ? parseInt(m[1]) : 9999999;
}

function sb(col) {
  if (sc === col) { sd *= -1; } else { sc = col; sd = 1; }
  ['neg','subject','notes','cat'].forEach(function(c) {
    const el = document.getElementById('th-' + c);
    if (!el) return;
    el.className = sc === c ? 'sorted' : '';
    el.textContent = el.textContent.replace(/ [↑↓]$/, '');
    if (sc === c) el.textContent += (sd === 1 ? ' ↑' : ' ↓');
  });
  render();
}

function buildTagFilters() {
  const wrap = document.getElementById('tagfilters');
  wrap.innerHTML = '';
  const all = document.createElement('button');
  all.className = 'tf active';
  all.textContent = 'All';
  all.onclick = function() { activeTag = ''; document.querySelectorAll('.tf').forEach(function(b){b.classList.remove('active');}); all.classList.add('active'); render(); };
  wrap.appendChild(all);
  CATS.forEach(function(c) {
    const b = document.createElement('button');
    b.className = 'tf';
    b.textContent = c;
    b.onclick = function() {
      activeTag = (activeTag === c) ? '' : c;
      document.querySelectorAll('.tf').forEach(function(x){x.classList.remove('active');});
      if (activeTag) { b.classList.add('active'); } else { all.classList.add('active'); }
      render();
    };
    wrap.appendChild(b);
  });
}

function filtered() {
  const q = (document.getElementById('sq').value || '').toLowerCase();
  const unscanned = document.getElementById('unscanonly').checked;
  return DATA.filter(function(r) {
    if (activeTag && r.cat !== activeTag) return false;
    if (unscanned && scanned.has(r._id)) return false;
    if (!q) return true;
    return (r.neg || '').toLowerCase().indexOf(q) >= 0 ||
           (r.subject || '').toLowerCase().indexOf(q) >= 0 ||
           (r.notes || '').toLowerCase().indexOf(q) >= 0;
  });
}

function sorted(arr) {
  return arr.slice().sort(function(a, b) {
    const av = a[sc] || '', bv = b[sc] || '';
    if (sc === 'neg') return (nv(av) - nv(bv)) * sd;
    return av.localeCompare(bv) * sd;
  });
}

function updateStat() {
  const f = filtered();
  const scannedInView = f.filter(function(r){ return scanned.has(r._id); }).length;
  document.getElementById('stat').textContent = f.length + ' entries' + (scannedInView > 0 ? ' (' + scannedInView + ' scanned)' : '');
}

function makeRow(r) {
  const tr = document.createElement('tr');
  tr.setAttribute('data-id', r._id);
  tr.className = scanned.has(r._id) ? 'scanned-row' : '';

  // Neg
  const tdNeg = document.createElement('td');
  tdNeg.className = 'neg';
  tdNeg.textContent = r.neg || '—';
  tr.appendChild(tdNeg);

  // Subject (verbatim)
  const tdSub = document.createElement('td');
  tdSub.className = 'subject';
  tdSub.textContent = r.subject || '';
  tr.appendChild(tdSub);

  // Notes / cross-refs
  const tdNotes = document.createElement('td');
  tdNotes.className = 'notes';
  if (r.notes) {
    tdNotes.textContent = r.notes;
  } else {
    tdNotes.textContent = '';
  }
  tr.appendChild(tdNotes);

  // Category tag
  const tdCat = document.createElement('td');
  tdCat.className = 'cat';
  if (r.cat) {
    const tag = document.createElement('span');
    tag.className = 'tag tag-' + r.cat;
    tag.textContent = r.cat;
    tdCat.appendChild(tag);
  }
  tr.appendChild(tdCat);

  // Scanned checkbox
  const tdScan = document.createElement('td');
  tdScan.className = 'scan-cell';
  const cb = document.createElement('input');
  cb.type = 'checkbox';
  cb.checked = scanned.has(r._id);
  cb.title = 'Mark as scanned';
  cb.onchange = (function(id) { return function() { toggleScanned(id); }; })(r._id);
  tdScan.appendChild(cb);
  tr.appendChild(tdScan);

  return tr;
}

function render() {
  const f = sorted(filtered());
  updateStat();
  const tb = document.getElementById('tb');
  tb.innerHTML = '';
  const frag = document.createDocumentFragment();
  f.forEach(function(r) { frag.appendChild(makeRow(r)); });
  tb.appendChild(frag);
  document.getElementById('empty').style.display = f.length === 0 ? 'block' : 'none';
}

function jumpTo(val) {
  val = (val || '').trim();
  if (!val) return;
  // find first visible row whose neg starts with val
  const rows = document.querySelectorAll('#tb tr');
  for (let i = 0; i < rows.length; i++) {
    const neg = rows[i].querySelector('td.neg');
    if (neg && neg.textContent.trim().startsWith(val)) {
      rows[i].scrollIntoView({behavior: 'smooth', block: 'center'});
      rows[i].style.outline = '2px solid #2a52a0';
      setTimeout(function(){ rows[i].style.outline = ''; }, 1800);
      return;
    }
  }
  toast('Neg ' + val + ' not found in current view');
}

function exportCSV() {
  const f = sorted(filtered());
  const lines = ['"Neg #","Subject / Name (verbatim)","Notes","Category","Scanned"'];
  f.forEach(function(r) {
    lines.push([r.neg, r.subject, r.notes, r.cat, scanned.has(r._id) ? 'Yes' : 'No'].map(function(v) {
      return '"' + (v || '').replace(/"/g, '""') + '"';
    }).join(','));
  });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([lines.join('\n')], {type: 'text/csv'}));
  a.download = 'wc_archive_export.csv';
  a.click();
  toast('Exported ' + f.length + ' rows');
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show';
  setTimeout(function(){ el.className = 'toast'; }, 2500);
}

// init
buildTagFilters();
updateProgress();
render();
</script>
</body>
</html>
