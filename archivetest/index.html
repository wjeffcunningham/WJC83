<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo Archive Index</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f4f0; color: #1a1a1a; padding: 2rem; }
  h1 { font-size: 22px; font-weight: 500; margin-bottom: 0.25rem; }
  .subtitle { font-size: 14px; color: #666; margin-bottom: 1.5rem; }
  .controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 1rem; }
  input[type=text] { padding: 8px 12px; border: 0.5px solid #ccc; border-radius: 8px; font-size: 14px; min-width: 200px; flex: 1; background: #fff; }
  input[type=text]:focus { outline: none; border-color: #888; }
  select { padding: 8px 12px; border: 0.5px solid #ccc; border-radius: 8px; font-size: 14px; background: #fff; min-width: 160px; }
  .stat { font-size: 13px; color: #888; margin-left: auto; white-space: nowrap; }
  .table-wrap { background: #fff; border-radius: 12px; border: 0.5px solid #ddd; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; table-layout: fixed; }
  thead th { text-align: left; font-weight: 500; font-size: 12px; color: #888; padding: 10px 12px; border-bottom: 0.5px solid #e0e0e0; cursor: pointer; user-select: none; background: #fafaf8; white-space: nowrap; }
  thead th:hover { color: #1a1a1a; }
  .arr { margin-left: 4px; opacity: 0.4; font-size: 10px; }
  th.active .arr { opacity: 1; }
  td { padding: 8px 12px; border-bottom: 0.5px solid #f0f0f0; vertical-align: top; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #fafaf8; }
  .neg { font-variant-numeric: tabular-nums; color: #888; font-size: 13px; font-family: monospace; }
  .notes { color: #666; font-size: 13px; }
  .badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 20px; font-weight: 500; }
  .cat-People    { background: #dbeafe; color: #1e40af; }
  .cat-Aviation  { background: #dcfce7; color: #166534; }
  .cat-Events    { background: #fef3c7; color: #92400e; }
  .cat-Places    { background: #d1fae5; color: #065f46; }
  .cat-Sports    { background: #fce7f3; color: #9d174d; }
  .cat-Misc      { background: #f3f4f6; color: #374151; }
  .empty { text-align: center; padding: 3rem; color: #aaa; font-size: 14px; }
  th:nth-child(1) { width: 90px; }
  th:nth-child(2) { width: 42%; }
  th:nth-child(3) { width: auto; }
  th:nth-child(4) { width: 95px; }
  @media (max-width: 600px) {
    body { padding: 1rem; }
    th:nth-child(3) { display: none; }
    td:nth-child(3) { display: none; }
  }
</style>
</head>
<body>

<h1>Photo Archive Index</h1>
<p class="subtitle">A section — sortable by any column</p>

<div class="controls">
  <input type="text" id="search" placeholder="Search subject, name, notes, number…" oninput="render()">
  <select id="catFilter" onchange="render()">
    <option value="">All categories</option>
    <option value="People">People</option>
    <option value="Aviation">Aviation</option>
    <option value="Events">Events</option>
    <option value="Places">Places</option>
    <option value="Sports">Sports</option>
    <option value="Misc">Misc</option>
  </select>
  <span class="stat" id="stat"></span>
</div>

<div class="table-wrap">
<table>
  <thead>
    <tr>
      <th onclick="sortBy('neg')" id="th-neg">Neg # <span class="arr" id="arr-neg">↕</span></th>
      <th onclick="sortBy('subject')" id="th-subject">Subject / Name <span class="arr" id="arr-subject">↕</span></th>
      <th onclick="sortBy('notes')" id="th-notes">Notes <span class="arr" id="arr-notes">↕</span></th>
      <th onclick="sortBy('cat')" id="th-cat">Category <span class="arr" id="arr-cat">↕</span></th>
    </tr>
  </thead>
  <tbody id="tbody"></tbody>
</table>
</div>

let sortCol = "neg";
let sortDir = 1;

function negVal(s) {
  const m = s.match(/^(\d+)/);
  return m ? parseInt(m[1]) : 0;
}

function sortBy(col) {
  if (sortCol === col) sortDir *= -1;
  else { sortCol = col; sortDir = 1; }
  render();
}

function render() {
  const q = document.getElementById("search").value.toLowerCase();
  const cf = document.getElementById("catFilter").value;

  let data = raw.filter(r => {
    const text = (r.subject + " " + r.notes + " " + r.neg).toLowerCase();
    return (!q || text.includes(q)) && (!cf || r.cat === cf);
  });

  data.sort((a, b) => {
    let av, bv;
    if (sortCol === "neg") { av = negVal(a.neg); bv = negVal(b.neg); }
    else { av = a[sortCol].toLowerCase(); bv = b[sortCol].toLowerCase(); }
    return av < bv ? -sortDir : av > bv ? sortDir : 0;
  });

  ["neg","subject","notes","cat"].forEach(c => {
    const th = document.getElementById("th-" + c);
    const arr = document.getElementById("arr-" + c);
    th.classList.toggle("active", sortCol === c);
    arr.textContent = sortCol !== c ? "↕" : sortDir === 1 ? "↑" : "↓";
  });

  const tbody = document.getElementById("tbody");
  if (!data.length) {
    tbody.innerHTML = `<tr><td colspan="4" class="empty">No entries match your search.</td></tr>`;
  } else {
    tbody.innerHTML = data.map(r => `
      <tr>
        <td class="neg">${r.neg}</td>
        <td>${r.subject}</td>
        <td class="notes">${r.notes}</td>
        <td><span class="badge cat-${r.cat}">${r.cat}</span></td>
      </tr>`).join("");
  }
  document.getElementById("stat").textContent = `${data.length} of ${raw.length} entries`;
}

render();
</script>
