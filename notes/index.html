<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NOTES | WJC83</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    body { margin:0; font:16px/1.5 system-ui, -apple-system, Segoe UI, Roboto, Inter, sans-serif; }
    .wrap { max-width:900px; margin:1.25rem auto 3rem; padding:0 1rem; }
    h1 { margin:.25rem 0 .25rem; }
    .intro { opacity:.8; margin-bottom:.75rem; }
    .list { border-top:2px solid var(--ink, #000); margin-top:1rem; }
    .item { padding:.65rem 0; border-bottom:1px dashed rgba(0,0,0,.2); display:flex; justify-content:space-between; gap:.75rem; }
    .item a { text-decoration:none; color:inherit; font-weight:600; }
    .meta { font-size:.9rem; opacity:.7; white-space:nowrap; }
    body.dark .item { border-bottom-color:rgba(255,255,255,.2); }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>NOTES</h1>
    <div class="intro">Drop <code>.txt</code>, <code>.md</code>, or <code>.html</code> files into <code>/notes</code> and they’ll appear here automatically.</div>
    <div id="list" class="list" role="list"></div>
  </div>

  <script>
    // ===== Optional: fill these to enable GitHub auto-listing =====
    // If your repo is public, this works without a token.
    const CONFIG = {
      owner: 'wjc83',     // ← change if different
      repo:  'WJC83',     // ← change if different
      branch: 'main'      // or 'master'
    };

    const ACCEPT = /\.(txt|md|html?)$/i;

    async function tryGithub() {
      if(!CONFIG.owner || !CONFIG.repo) return null;
      const u = `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/notes?ref=${CONFIG.branch}`;
      const res = await fetch(u);
      if (!res.ok) return null;
      const data = await res.json();
      // Filter to files we accept
      const files = data.filter(x => x.type === 'file' && ACCEPT.test(x.name));
      // Get commit date per file for sorting (newest first)
      const withDates = await Promise.all(files.map(async f => {
        try {
          const cu = `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/commits?path=${encodeURIComponent('notes/'+f.name)}&per_page=1`;
          const c = await fetch(cu).then(r=>r.json());
          const date = c?.[0]?.commit?.committer?.date || c?.[0]?.commit?.author?.date || '';
          return { name:f.name, path:'/notes/'+f.name, size:f.size||0, date };
        } catch { return { name:f.name, path:'/notes/'+f.name, size:f.size||0, date:'' }; }
      }));
      withDates.sort((a,b)=> new Date(b.date) - new Date(a.date));
      return withDates;
    }

    async function tryLocalManifest() {
      try {
        const r = await fetch('/notes/manifest.json', { cache:'no-store' });
        if (!r.ok) return null;
        const arr = await r.json();
        return arr.filter(x=>ACCEPT.test(x.name));
      } catch { return null; }
    }

    function render(list) {
      const root = document.getElementById('list');
      if (!list || !list.length) {
        root.innerHTML = `<div class="item"><div>No notes found. Either set <code>CONFIG</code> to your GitHub repo or add <code>/notes/manifest.json</code>.</div></div>`;
        return;
      }
      root.innerHTML = '';
      for (const f of list) {
        const d = f.date ? new Date(f.date) : null;
        const meta = d ? d.toLocaleString() : (f.size ? (Math.round(f.size/1024)+' KB') : '');
        const el = document.createElement('div');
        el.className = 'item';
        el.role = 'listitem';
        el.innerHTML = `
          <a href="${f.path}">${f.name}</a>
          <span class="meta">${meta||''}</span>
        `;
        root.appendChild(el);
      }
    }

    (async () => {
      let list = await tryGithub();
      if (!list) list = await tryLocalManifest();
      render(list || []);
      // schedule theme sync (same window as landing)
      function applyScheduledTheme(){ const h=(new Date()).getHours(); document.body.classList.toggle('dark', h>=0 && h<4); }
      applyScheduledTheme(); setInterval(applyScheduledTheme, 60000);
    })();
  </script>
</body>
</html>
