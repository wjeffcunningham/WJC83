<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WJC83.CA</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Header -->
 <header class="site-header">
    <h1 class="site-title">WJC83.CA</h1>
    <nav class="hamburger-menu">
      <button id="menu-toggle" aria-label="Menu">&#9776;</button>
      <ul id="menu">
        <li><button id="mode-toggle">☀︎ / ☾</button></li>
        <li><a href="#about">About</a></li>
      </ul>
    </nav>
  </header>

  <!-- Hero -->
  <section class="hero">
    <img src="assets/hero.jpg" alt="Hero Image">
  </section>

  <!-- Links -->
  <section class="links">
    <a href="ijpauc.net">IJPAUC?</a>
    <a href="vvipmedia.net">VVIP25</a>
    <a href="/archive">ARCHIVE</a>
    <a href="/notes">NOTES</a>
  </section>

  <!-- About -->
  <section id="about" class="about">
    <p>This is the personal website of W. Jeff Cunningham, born Nov 8, 1983. Resides in Vancouver, B.C.</p>
  </section>

  <script>
    // Hamburger toggle
    const menuToggle = document.getElementById('menu-toggle');
    const menu = document.getElementById('menu');
    menuToggle.addEventListener('click', () => {
      menu.classList.toggle('open');
    });

    // Dark/light toggle
    const modeToggle = document.getElementById('mode-toggle');
    modeToggle.addEventListener('click', () => {
      document.body.classList.toggle('dark');
    });
  </script>
</body>
</html>
